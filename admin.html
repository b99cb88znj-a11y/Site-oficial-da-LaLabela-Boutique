<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LaLabela Boutique - Painel</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:#f20b68;
  color:white;
  text-align:center;
  padding:35px 20px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:10px 0 0;
  font-size:20px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

.resumo{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:30px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card strong{
  display:block;
  color:#f20b68;
  font-size:35px;
}

.card span{
  color:#777;
  font-size:18px;
}

.produtos-box{
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.produtos-box h2{
  margin-top:0;
  font-size:28px;
}

.btn-add{
  background:#f20b68;
  color:white;
  border:0;
  padding:15px 25px;
  border-radius:14px;
  font-size:18px;
  cursor:pointer;
  margin-bottom:25px;
}

.produto{
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

.produto:last-child{
  border-bottom:0;
}

.produto img{
  width:140px;
  height:170px;
  object-fit:cover;
  border-radius:15px;
  background:#eee;
}

.info{
  flex:1;
}

.info h3{
  margin:0 0 8px;
  font-size:22px;
}

.preco{
  color:#f20b68;
  font-size:21px;
  font-weight:bold;
}

.categoria{
  color:#777;
  margin-top:6px;
}

.tag{
  display:inline-block;
  background:#fce0eb;
  color:#f20b68;
  padding:5px 10px;
  border-radius:20px;
  margin-top:8px;
  font-size:13px;
}

.btn-editar{
  background:#222;
  color:white;
  border:0;
  padding:13px 20px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

@media(max-width:700px){

  .resumo{
    grid-template-columns:1fr;
  }

  .produto{
    align-items:flex-start;
  }

  .produto img{
    width:100px;
    height:130px;
  }

  .info h3{
    font-size:18px;
  }

  .preco{
    font-size:18px;
  }

  .btn-editar{
    padding:10px 12px;
    font-size:14px;
  }

}

</style>
</head>

<body>

<header>

<h1>LaLabela Boutique</h1>

<p>Painel administrativo</p>

</header>


<div class="container">


<div class="resumo">

<div class="card">
<strong id="totalProdutos">0</strong>
<span>Produtos</span>
</div>

<div class="card">
<strong>R$ 0,00</strong>
<span>Vendas</span>
</div>

<div class="card">
<strong>0</strong>
<span>Pedidos</span>
</div>

</div>


<div class="produtos-box">

<h2>Produtos</h2>

<button class="btn-add" onclick="adicionarProduto()">
+ Adicionar produto
</button>

<div id="listaProdutos"></div>

</div>

</div>

function carregarProdutos(){

const lista = document.getElementById("listaProdutos");

lista.innerHTML="";

document.getElementById("totalProdutos").textContent =
PRODUTOS.length;


PRODUTOS.forEach((produto,index)=>{

const div=document.createElement("div");

div.className="produto";

const imagem =
produto.imagens && produto.imagens.length
? produto.imagens[0]
: "";


div.innerHTML=`

<img
src="${imagem}"
onerror="this.style.display='none'"
>

<div class="info">

<h3>${produto.nome}</h3>

<div class="preco">
R$ ${produto.preco.toFixed(2).replace(".",",")}
</div>

<div class="categoria">
${produto.categoria || ""}
</div>

${produto.tag ? `
<div class="tag">
${produto.tag}
</div>
` : ""}

</div>

<button
class="btn-editar"
onclick="editarProduto(${index})"
>
Editar
</button>

`;

lista.appendChild(div);

});

}


function editarProduto(index){

const produto=PRODUTOS[index];

alert(
