<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLabela Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* CSS mantido igual para não quebrar seu layout, apenas corrigido o JS abaixo */
:root{ --wine:#E91E63; --blush:#F8BBD0; --line:rgba(42,36,32,0.14); }
body{ margin:0; font-family:'Jost',sans-serif; }
.card{ border:1px solid var(--line); padding:10px; margin:10px; }
.opcoes-produto select{ width:100%; padding:8px; border:1px solid var(--wine); background:var(--blush); border-radius:6px; }
</style>
</head>
<body>

<!-- Conteúdo HTML permanece o mesmo -->
<div id="productGrid"></div>

<script>
let PRODUTOS = [];
let carrinho = [];

// --- CORREÇÃO DA LÓGICA DE ESTOQUE ---
function obterEstoqueDisponivel(p, cor, tamanho) {
    if (p.estoqueVariacoes && Array.isArray(p.estoqueVariacoes)) {
        // Busca a variação correspondente ao nome da Cor e Tamanho
        const variacao = p.estoqueVariacoes.find(v => 
            String(v.cor || "").trim().toLowerCase() === String(cor).trim().toLowerCase() && 
            String(v.tamanho || "").trim().toLowerCase() === String(tamanho).trim().toLowerCase()
        );
        
        if (variacao) {
            // Usa 'quantidade' conforme seu Firebase
            return Number(variacao.quantidade !== undefined ? variacao.quantidade : (variacao.qtd || 0));
        }
    }
    return Number(p.estoque || 0);
}

function adicionarAoCarrinho(i) {
    const p = PRODUTOS[i];
    const cor = document.getElementById(`cor-${i}`).value.trim();
    const tamanho = document.getElementById(`tamanho-${i}`).value.trim();

    if (!cor || !tamanho) { alert("Selecione Cor e Tamanho."); return; }

    const estoqueMaximo = obterEstoqueDisponivel(p, cor, tamanho);
    const itemExistente = carrinho.find(it => it.nome === p.nome && it.cor === cor && it.tamanho === tamanho);
    const qtdNoCarrinho = itemExistente ? itemExistente.qtd : 0;

    if (qtdNoCarrinho + 1 > estoqueMaximo) {
        alert(`Estoque insuficiente! Disponível apenas: ${estoqueMaximo} unidade(s) para esta combinação.`);
        return;
    }

    if (itemExistente) {
        itemExistente.qtd += 1;
    } else {
        carrinho.push({ nome: p.nome, preco: p.preco, estoqueMax: estoqueMaximo, imagem: p.imagens[0], qtd: 1, cor, tamanho });
    }
    alert("Adicionado à sacola!");
}

function normalizarProduto(doc) {
    const dados = doc.data();
    return {
        id: doc.id,
        nome: dados.nome || "Produto",
        preco: Number(dados.preco || 0),
        estoque: Number(dados.estoque || 0),
        estoqueVariacoes: dados.estoqueVariacoes || [], // Aqui puxa o array do Firebase
        imagens: dados.imagens || [],
        cores: dados.cores || [],
        tamanhos: dados.tamanhos || [],
        descricao: dados.descricao || "",
        tag: dados.tag || ""
    };
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = { /* seu config aqui */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(collection(db, "produtos"), snapshot => {
    PRODUTOS = snapshot.docs.map(doc => normalizarProduto(doc));
    // Re-renderizar vitrine aqui...
});
</script>

</body>
</html>
