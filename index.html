<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLabela Boutique — Loja</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#fafafa;
    color:#171717;
}
header{
    background:#fff;
    border-bottom:1px solid #eee;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}
.logo-loja{
    font-family:Georgia,serif;
    font-size:26px;
    color:#e52b79;
    font-weight:bold;
}
.header-actions{
    display:flex;
    gap:15px;
    align-items:center;
}
.btn-carrinho, .btn-meus-pedidos{
    background:#fff0f6;
    color:#e52b79;
    border:1px solid #ffccd5;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}
.container{
    max-width:1200px;
    margin:0 auto;
    padding:30px 20px;
}
h1{
    font-size:24px;
    margin-bottom:20px;
}
.grid-produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
}
.produto-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:.2s;
}
.produto-card:hover{
    border-color:#e52b79;
    box-shadow:0 5px 15px rgba(229,43,121,0.08);
}
.produto-img{
    width:100%;
    height:260px;
    object-fit:cover;
    background:#f3f3f3;
}
.produto-info{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
}
.produto-titulo{
    font-weight:bold;
    font-size:16px;
}
.produto-preco{
    color:#e52b79;
    font-size:18px;
    font-weight:bold;
}
.btn-comprar{
    background:#e52b79;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:10px;
    font-weight:bold;
    cursor:pointer;
    width:100%;
    margin-top:10px;
}
.btn-comprar:hover{
    background:#c91d63;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.aberto{
    display:flex;
}
.modal-box{
    background:#fff;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
}
.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.fechar{
    border:0;
    background:#f3f3f3;
    width:36px;
    height:36px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
}
.form-group{
    margin-bottom:15px;
}
.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}
.form-group input, .form-group select, .form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    font-size:14px;
}
.variacoes-selecao{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:5px;
}
.opcao-pill{
    border:1px solid #ddd;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    background:#fff;
}
.opcao-pill.selecionado{
    border-color:#e52b79;
    background:#fff0f6;
    color:#e52b79;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <div class="logo-loja">LaLabela Boutique</div>
    <div class="header-actions">
        <button class="btn-meus-pedidos" onclick="abrirMeusPedidos()">Meus Pedidos</button>
        <button class="btn-carrinho" onclick="abrirCarrinho()">Carrinho (<span id="contadorCarrinho">0</span>)</button>
    </div>
</header>

<div class="container">
    <h1>Lançamentos e Destaques</h1>
    <div class="grid-produtos" id="gridProdutos">
        <div style="grid-column: 1/-1; text-align:center; color:#888; padding:40px;">Carregando produtos...</div>
    </div>
</div>

<!-- MODAL DETALHES / COMPRA -->
<div class="modal" id="modalProduto">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="detalheNome" style="margin:0; font-size:20px;">Produto</h2>
            <button class="fechar" onclick="fecharModalProduto()">×</button>
        </div>
        <div id="detalheConteudo"></div>
    </div>
</div>

<!-- MODAL CARRINHO / CHECKOUT -->
<div class="modal" id="modalCarrinho">
    <div class="modal-box" style="max-width:700px;">
        <div class="modal-header">
            <h2 style="margin:0; font-size:20px;">Finalizar Pedido</h2>
            <button class="fechar" onclick="fecharCarrinho()">×</button>
        </div>
        <div id="conteudoCarrinho"></div>
    </div>
</div>

<!-- MODAL MEUS PEDIDOS -->
<div class="modal" id="modalMeusPedidos">
    <div class="modal-box" style="max-width:700px;">
        <div class="modal-header">
            <h2 style="margin:0; font-size:20px;">Consultar Meus Pedidos</h2>
            <button class="fechar" onclick="fecharMeusPedidos()">×</button>
        </div>
        <div class="form-group">
            <label>Informe seu e-mail cadastrado:</label>
            <div style="display:flex; gap:10px;">
                <input type="email" id="emailConsulta" placeholder="seuemail@gmail.com">
                <button class="btn-comprar" style="width:140px; margin-top:0;" onclick="buscarPedidosCliente()">Buscar</button>
            </div>
        </div>
        <div id="listaMeusPedidos" style="margin-top:20px; display:flex; flex-direction:column; gap:12px;"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAqid6M2HB8_V0vWozjbZEInGpsNZ8IfKQ",
    authDomain: "lalabela-boutique.firebaseapp.com",
    projectId: "lalabela-boutique",
    storageBucket: "lalabela-boutique.firebasestorage.app",
    messagingSenderId: "642045507952",
    appId: "1:642045507952:web:8953c11428090b4a41b7b5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtosLoja = [];
let carrinho = [];
let produtoAtualSelecionado = null;
let corSelecionada = "";
let tamanhoSelecionado = "";

window.carregarProdutosLoja = async function() {
    try {
        const snapshot = await getDocs(collection(db, "produtos"));
        produtosLoja = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarGrid();
    } catch(e) {
        console.error(e);
        document.getElementById("gridProdutos").innerHTML = `<div style="grid-column:1/-1; text-align:center; color:red;">Erro ao carregar produtos.</div>`;
    }
}

function renderizarGrid() {
    const grid = document.getElementById("gridProdutos");
    grid.innerHTML = "";
    if(produtosLoja.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#888; padding:40px;">Nenhum produto disponível no momento.</div>`;
        return;
    }
    produtosLoja.forEach((p, index) => {
        const foto = p.imagens && p.imagens.length ? p.imagens[0] : "";
        grid.innerHTML += `
            <div class="produto-card">
                ${foto ? `<img src="${foto}" class="produto-img">` : `<div class="produto-img" style="display:flex; align-items:center; justify-content:center; font-size:30px;">🛍️</div>`}
                <div class="produto-info">
                    <div class="produto-titulo">${p.nome || 'Produto'}</div>
                    <div class="produto-preco">R$ ${Number(p.preco || 0).toFixed(2).replace('.',',')}</div>
                    <button class="btn-comprar" onclick="abrirDetalhesProduto(${index})">Ver / Comprar</button>
                </div>
            </div>
        `;
    });
}

window.abrirDetalhesProduto = function(index) {
    produtoAtualSelecionado = produtosLoja[index];
    corSelecionada = "";
    tamanhoSelecionado = "";
    
    const foto = produtoAtualSelecionado.imagens && produtoAtualSelecionado.imagens.length ? produtoAtualSelecionado.imagens[0] : "";
    
    let coresHtml = "";
    if(produtoAtualSelecionado.cores && Array.isArray(produtoAtualSelecionado.cores)) {
        produtoAtualSelecionado.cores.forEach(c => {
            coresHtml += `<div class="opcao-pill" onclick="selecionarCor('${c}', this)">${c}</div>`;
        });
    }

    let tamanhosHtml = "";
    if(produtoAtualSelecionado.tamanhos && Array.isArray(produtoAtualSelecionado.tamanhos)) {
        produtoAtualSelecionado.tamanhos.forEach(t => {
            tamanhosHtml += `<div class="opcao-pill" onclick="selecionarTamanho('${t}', this)">${t}</div>`;
        });
    }

    document.getElementById("detalheNome").textContent = produtoAtualSelecionado.nome;
    document.getElementById("detalheConteudo").innerHTML = `
        <div style="display:flex; flex-direction:column; gap:15px;">
            ${foto ? `<img src="${foto}" style="width:100%; height:280px; object-fit:cover; border-radius:10px;">` : ''}
            <div style="font-size:20px; color:#e52b79; font-weight:bold;">R$ ${Number(produtoAtualSelecionado.preco || 0).toFixed(2).replace('.',',')}</div>
            <div><strong>Descrição:</strong> ${produtoAtualSelecionado.descricao || 'Sem descrição.'}</div>
            <div>
                <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:5px;">Escolha a Cor:</label>
                <div class="variacoes-selecao">${coresHtml || '<span>Cor única</span>'}</div>
            </div>
            <div>
                <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:5px;">Escolha o Tamanho:</label>
                <div class="variacoes-selecao">${tamanhosHtml || '<span>Tamanho único</span>'}</div>
            </div>
            <button class="btn-comprar" onclick="adicionarAoCarrinho()">Adicionar ao Carrinho</button>
        </div>
    `;
    document.getElementById("modalProduto").classList.add("aberto");
}

window.selecionarCor = function(cor, el) {
    document.querySelectorAll('#detalheConteudo .variacoes-selecao')[0].querySelectorAll('.opcao-pill').forEach(p => p.classList.remove('selecionado'));
    el.classList.add('selecionado');
    corSelecionada = cor;
}

window.selecionarTamanho = function(tam, el) {
    document.querySelectorAll('#detalheConteudo .variacoes-selecao')[1].querySelectorAll('.opcao-pill').forEach(p => p.classList.remove('selecionado'));
    el.classList.add('selecionado');
    tamanhoSelecionado = tam;
}

window.fecharModalProduto = function() {
    document.getElementById("modalProduto").classList.remove("aberto");
}

window.adicionarAoCarrinho = function() {
    carrinho.push({
        id: produtoAtualSelecionado.id,
        nome: produtoAtualSelecionado.nome,
        preco: produtoAtualSavedPreco(produtoAtualSelecionado.preco),
        cor: corSelecionada || 'Única',
        tamanho: tamanhoSelecionado || 'Único',
        quantidade: 1
    });
    document.getElementById("contadorCarrinho").textContent = carrinho.length;
    fecharModalProduto();
    alert("Produto adicionado ao carrinho!");
}

function produtoAtualSavedPreco(val) {
    return Number(val || 0);
}

window.abrirCarrinho = function() {
    const modal = document.getElementById("modalCarrinho");
    const container = document.getElementById("conteudoCarrinho");
    modal.classList.add("aberto");

    if(carrinho.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">Seu carrinho está vazio.</div>`;
        return;
    }

    let itensHtml = "";
    let subtotal = 0;
    carrinho.forEach((item, idx) => {
        subtotal += item.preco * item.quantidade;
        itensHtml += `
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:10px 0;">
                <div>
                    <strong>${item.nome}</strong><br>
                    <span style="font-size:12px; color:#666;">Cor: ${item.cor} | Tam: ${item.tamanho}</span>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <span>R$ ${(item.preco * item.quantidade).toFixed(2).replace('.',',')}</span>
                    <button style="border:0; background:#fff0f0; color:red; border-radius:5px; padding:5px 8px; cursor:pointer;" onclick="removerItemCarrinho(${idx})">Remover</button>
                </div>
            </div>
        `;
    });

    // Recupera dados salvos de e-mail e endereço se houver
    let emailSalvo = localStorage.getItem("lalabela_email") || "";
    let enderecoSalvo = localStorage.getItem("lalabela_endereco") || "";
    let whatsappSalvo = localStorage.getItem("lalabela_whatsapp") || "";

    container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:15px;">
            <div style="max-height:200px; overflow:auto;">${itensHtml}</div>
            <div style="font-weight:bold; text-align:right; font-size:16px;">Subtotal: R$ <span id="lblSubtotal">${subtotal.toFixed(2).replace('.',',')}</span></div>
            
            <hr style="border:0; border-top:1px solid #eee;">
            
            <div class="form-group">
                <label>E-mail (para consultar pedidos futuros)</label>
                <input type="email" id="checkoutEmail" value="${emailSalvo}" placeholder="seuemail@gmail.com">
            </div>

            <div class="form-group">
                <label>WhatsApp para contato</label>
                <input type="text" id="checkoutWhatsapp" value="${whatsappSalvo}" placeholder="(44) 99999-9999">
            </div>

            <div class="form-group">
                <label>Cidade de Entrega</label>
                <select id="checkoutCidade" onchange="atualizarFreteEdata()">
                    <option value="">Selecione a cidade</option>
                    <option value="Paranavaí">Paranavaí (Taxa fixa R$ 10,00 | Prazo: 2 horas)</option>
                    <option value="São João do Caiuá">São João do Caiuá (Taxa fixa R$ 25,00 | Entrega no próximo domingo)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Endereço de Entrega</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="checkoutEndereco" value="${enderecoSalvo}" placeholder="Rua, número, bairro">
                    <button type="button" style="border:1px solid #ddd; background:#fff; border-radius:8px; padding:0 10px; cursor:pointer; font-size:12px;" onclick="salvarEditarEndereco()">Salvar Endereço</button>
                </div>
            </div>

            <div class="form-group" id="blocoInfoEntrega" style="font-size:13px; color:#e52b79; background:#fff0f6; padding:10px; border-radius:8px; display:none;"></div>

            <div class="form-group">
                <label>Observação (Especifique o horário que estará disponível para receber)</label>
                <textarea id="checkoutObs" placeholder="Ex: Disponível a partir das 14h..."></textarea>
            </div>

            <div style="background:#fafafa; border:1px solid #eee; padding:15px; border-radius:8px; display:flex; flex-direction:column; gap:5px;">
                <div>Frete: <strong id="lblFrete">R$ 0,00</strong></div>
                <div style="font-size:18px; color:#e52b79;">Total Geral: <strong id="lblTotalGeral">R$ ${subtotal.toFixed(2).replace('.',',')}</strong></div>
            </div>

            <button class="btn-comprar" onclick="finalizarCompraFirebase(${subtotal})">Pagar e Finalizar Pedido</button>
        </div>
    `;
}

window.removerItemCarrinho = function(idx) {
    carrinho.splice(idx, 1);
    document.getElementById("contadorCarrinho").textContent = carrinho.length;
    abrirCarrinho();
}

window.salvarEditarEndereco = function() {
    const email = document.getElementById("checkoutEmail").value.trim();
    const end = document.getElementById("checkoutEndereco").value.trim();
    const wsp = document.getElementById("checkoutWhatsapp").value.trim();
    if(email) localStorage.setItem("lalabela_email", email);
    if(end) localStorage.setItem("lalabela_endereco", end);
    if(wsp) localStorage.setItem("lalabela_whatsapp", wsp);
    alert("Informações salvas com sucesso!");
}

window.atualizarFreteEdata = function() {
    const cidade = document.getElementById("checkoutCidade").value;
    const blocoInfo = document.getElementById("blocoInfoEntrega");
    let subtotal = carrinho.reduce((acc, i) => acc + (i.preco * i.quantidade), 0);
    let frete = 0;

    if(cidade === 'Paranavaí') {
        frete = 10.00;
        blocoInfo.style.display = 'block';
        blocoInfo.innerHTML = '🕒 Prazo de entrega estimado em Paranavaí: <strong>2 horas</strong>.';
    } else if(cidade === 'São João do Caiuá') {
        frete = 25.00;
        // Calcula o próximo domingo
        let hoje = new Date();
        let diaSemana = hoje.getDay(); // 0 é domingo
        let diasAtéDomingo = (7 - diaSemana) % 7;
        if(diasAtéDomingo === 0) diasAtéDomingo = 7;
        let proximoDomingo = new Date(hoje.getTime() + diasAtéDomingo * 24 * 60 * 60 * 1000);
        let dataFormatada = proximoDomingo.toLocaleDateString('pt-BR');

        blocoInfo.style.display = 'block';
        blocoInfo.innerHTML = `📅 Entregas em São João do Caiuá ocorrem todo domingo. Próxima entrega: <strong>${dataFormatada}</strong>.`;
    } else {
        blocoInfo.style.display = 'none';
    }

    document.getElementById("lblFrete").textContent = "R$ " + frete.toFixed(2).replace('.',',');
    document.getElementById("lblTotalGeral").textContent = "R$ " + (subtotal + frete).toFixed(2).replace('.',',');
}

window.finalizarCompraFirebase = async function(subtotal) {
    const email = document.getElementById("checkoutEmail").value.trim();
    const whatsapp = document.getElementById("checkoutWhatsapp").value.trim();
    const cidade = document.getElementById("checkoutCidade").value;
    const endereco = document.getElementById("checkoutEndereco").value.trim();
    const obs = document.getElementById("checkoutObs").value.trim();

    if(!email || !whatsapp || !cidade || !endereco) {
        alert("Por favor, preencha E-mail, WhatsApp, Cidade e Endereço.");
        return;
    }

    let frete = cidade === 'Paranavaí' ? 10.00 : 25.00;
    let totalGeral = subtotal + frete;

    // Salva localmente e-mail e endereço
    localStorage.setItem("lalabela_email", email);
    localStorage.setItem("lalabela_endereco", endereco);
    localStorage.setItem("lalabela_whatsapp", whatsapp);

    try {
        await addDoc(collection(db, "pedidos"), {
            cliente: email,
            whatsapp: whatsapp,
            itens: carrinho,
            cidade: cidade,
            endereco: endereco + ` (Obs: ${obs})`,
            subtotal: subtotal,
            frete: frete,
            total: totalGeral,
            statusPagamento: "Pago", // Pagamento direto pelo site
            status: "Aberto",
            criadoEm: serverTimestamp()
        });

        alert("Pedido realizado e pago com sucesso!");
        carrinho = [];
        document.getElementById("contadorCarrinho").textContent = 0;
        fecharCarrinho();
    } catch(e) {
        console.error(e);
        alert("Erro ao registrar pedido. Tente novamente.");
    }
}

window.fecharCarrinho = function() {
    document.getElementById("modalCarrinho").classList.remove("aberto");
}

window.abrirMeusPedidos = function() {
    document.getElementById("modalMeusPedidos").classList.add("aberto");
    let emailSalvo = localStorage.getItem("lalabela_email") || "";
    if(emailSalvo) {
        document.getElementById("emailConsulta").value = emailSalvo;
        buscarPedidosCliente();
    }
}

window.fecharMeusPedidos = function() {
    document.getElementById("modalMeusPedidos").classList.remove("aberto");
}

window.buscarPedidosCliente = async function() {
    const email = document.getElementById("emailConsulta").value.trim();
    const listaDiv = document.getElementById("listaMeusPedidos");
    if(!email) {
        alert("Digite um e-mail.");
        return;
    }

    listaDiv.innerHTML = "Buscando pedidos...";

    try {
        const q = query(collection(db, "pedidos"), where("cliente", "==", email));
        const snapshot = await getDocs(q);
        
        listaDiv.innerHTML = "";
        if(snapshot.empty) {
            listaDiv.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">Nenhum pedido encontrado para este e-mail.</div>`;
            return;
        }

        snapshot.forEach(docSnap => {
            const p = docSnap.data();
            let itensDesc = "";
            if(p.itens && Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    itensDesc += `<div>• ${i.nome} (Cor: ${i.cor}, Tam: ${i.tamanho})</div>`;
                });
            }

            listaDiv.innerHTML += `
                <div style="border:1px solid #eee; border-radius:10px; padding:15px; background:#fafafa;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <strong>Pedido #${docSnap.id.slice(-6)}</strong>
                        <span style="color:#e52b79; font-weight:bold;">R$ ${Number(p.total || 0).toFixed(2).replace('.',',')}</span>
                    </div>
                    <div style="font-size:13px; color:#555; display:flex; flex-direction:column; gap:4px;">
                        <div><strong>Itens:</strong> ${itensDesc}</div>
                        <div><strong>Endereço:</strong> ${p.endereco}</div>
                        <div><strong>Status Pagamento:</strong> <span style="color:green;">${p.statusPagamento || 'Pago'}</span></div>
                        <div><strong>Status do Pedido:</strong> <strong>${p.status || 'Aberto'}</strong></div>
                    </div>
                </div>
            `;
        });
    } catch(e) {
        console.error(e);
        listaDiv.innerHTML = `<div style="color:red; text-align:center;">Erro ao buscar pedidos.</div>`;
    }
}

// Inicializar carregamento de produtos
carregarProdutosLoja();
</script>

</body>
</html>
